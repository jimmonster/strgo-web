# Independent administrator studio; no paid image API is exposed on this host.
server {
    listen 80;
    server_name {{workflow_domain}};
    root {{site_root}}/current/local-studio;
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://{{workflow_domain}}$request_uri; }
}
server {
    listen 443 ssl;
    server_name {{workflow_domain}};
    ssl_certificate {{cert_dir}}/fullchain.pem;
    ssl_certificate_key {{cert_dir}}/privkey.pem;
    root {{site_root}}/current/local-studio;
    index index.html;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    location ^~ /api/image/local-studio/ {
        client_max_body_size 3m;
        proxy_pass http://127.0.0.1:{{api_port}};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 180s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
    }
    location /api/ { return 404; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
}
