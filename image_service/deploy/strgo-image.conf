# Include inside the strgo.com server block. Keep OSS private.
location ^~ /api/image/ {
    client_max_body_size 7m;
    proxy_pass http://127.0.0.1:8092;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 180s;
    proxy_send_timeout 30s;
    proxy_buffering off;
    proxy_cache off;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox" always;
}
location = /api/image { default_type application/json; return 404 '{"error":"接口不存在"}'; }

# Shared identity, private audio Range requests and durable SSE replay.
location ^~ /api/ai/v1/ {
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:8092;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 180s;
    proxy_send_timeout 30s;
    proxy_buffering off;
    proxy_cache off;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
