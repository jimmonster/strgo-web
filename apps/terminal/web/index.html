<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="theme-color" content="#ededed">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="终端">
  <meta name="robots" content="noindex,nofollow">
  <title>STRGO · 我的终端</title>
  <link rel="stylesheet" href="/terminal/workspace.css">
  <script defer src="/terminal/workspace.js"></script>
</head>
<body>
  <main id="auth-view" class="auth-view">
    <a class="auth-brand" href="/">&gt;_ STRGO</a>
    <section class="auth-form" aria-labelledby="auth-title">
      <span class="app-icon" aria-hidden="true">&gt;_</span>
      <h1 id="auth-title">我的终端</h1>
      <p class="auth-description">使用 AI 生图的账号登录</p>
      <form id="account-login">
        <label for="account-name">账号</label>
        <input id="account-name" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required minlength="3" maxlength="32" placeholder="输入账号">
        <label for="account-password">密码</label>
        <input id="account-password" name="password" type="password" autocomplete="current-password" required maxlength="256" placeholder="输入密码">
        <button id="account-submit" class="primary" type="submit" disabled>正在检查登录…</button>
      </form>
      <p id="auth-message" class="feedback" role="status" aria-live="polite"></p>
      <p class="auth-description">登录状态保留 7 天，到期后重新登录</p>
      <a class="auth-link" href="/image-playground/">前往 AI 生图注册账号 ↗</a>
    </section>
    <footer><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">渝ICP备2026024419号-1</a></footer>
  </main>
  <main id="app-view" class="app-view" hidden>
    <nav class="rail" aria-label="站点导航">
      <a class="rail-brand" href="/" title="STRGO 首页" aria-label="STRGO 首页">&gt;_</a>
      <span class="rail-active" title="我的终端" aria-label="我的终端">▤</span>
      <a class="rail-image" href="/image-playground/" title="AI 生图" aria-label="AI 生图">▧</a>
      <a class="rail-image" href="/forum/" title="交流社区" aria-label="交流社区">☏</a>
      <button id="account-logout" class="rail-logout" type="button" title="退出账号" aria-label="退出账号">⇥</button>
    </nav>
    <aside id="conversation-sidebar" class="conversation-sidebar" aria-label="终端会话">
      <header class="sidebar-heading"><h1>终端</h1><button id="new-terminal" class="icon-button" type="button" aria-label="新建终端" title="新建终端">＋</button></header>
      <div class="search-field"><label class="sr-only" for="session-search">搜索终端</label><input id="session-search" type="search" placeholder="搜索终端" autocomplete="off"></div>
      <div id="conversation-list" class="conversation-list" role="list" aria-label="终端窗口列表"></div>
      <p id="list-empty" class="list-empty" hidden>没有匹配的终端</p>
      <nav class="mobile-session-actions mobile-only" aria-label="当前终端操作"><button id="mobile-connect" type="button">连接</button><button id="mobile-rename" type="button">改名</button><button id="mobile-export" type="button">导出</button><button id="mobile-clear" type="button">清屏</button><button id="mobile-close" type="button">关闭</button></nav>
      <div class="sidebar-bottom"><button id="new-ssh" type="button">＋ SSH 连接</button><span id="window-count">0 / 8 个窗口</span></div>
      <div class="account-summary"><span id="account-avatar" class="account-avatar" aria-hidden="true">U</span><div><strong id="account-label"></strong><span>个人工作区 · 文件独立保存</span></div><button id="mobile-logout" class="mobile-only icon-button" type="button" title="退出账号" aria-label="退出账号">⇥</button></div>
    </aside>
    <section class="conversation" aria-label="当前终端">
      <header class="conversation-heading">
        <button id="show-sessions" class="icon-button mobile-only" type="button" aria-label="打开终端列表" aria-controls="conversation-sidebar" aria-expanded="false" title="终端列表">☰</button>
        <div class="conversation-title"><h2 id="conversation-name">我的终端</h2><span id="conversation-status">准备就绪</span></div>
        <div class="conversation-tools">
          <button id="reconnect-session" type="button" title="重新连接">连接</button>
          <button id="session-menu-toggle" class="icon-button" type="button" aria-label="终端选项" title="终端选项" aria-expanded="false" aria-controls="session-menu">⋯</button>
        </div>
        <div id="session-menu" class="session-menu" hidden>
          <button id="rename-session" type="button">重命名</button>
          <button id="export-session" type="button">导出当前聊天</button>
          <button id="clear-session" type="button">清除聊天记录</button>
          <button id="close-session" class="danger" type="button">关闭窗口</button>
        </div>
      </header>
      <p id="workspace-message" class="workspace-message" role="status" aria-live="polite" hidden></p>
      <div id="session-frames" class="session-frames"></div>
      <div id="workspace-empty" class="workspace-empty" hidden><span class="app-icon" aria-hidden="true">&gt;_</span><h2>打开一个终端，开始工作</h2><button id="empty-create" class="primary" type="button">新建终端</button></div>
      <footer class="workspace-footer"><span id="workspace-boundary">离线 Linux 工作区 · 文件保留，进程随连接结束</span><span>最多 8 个窗口</span></footer>
    </section>
  </main>
  <div id="sidebar-shade" class="sidebar-shade" hidden></div>
  <dialog id="action-dialog" aria-labelledby="action-title">
    <form id="action-form"><h2 id="action-title"></h2><p id="action-description"></p><label id="rename-label" for="rename-value" hidden>终端名称</label><input id="rename-value" maxlength="32" hidden><div class="dialog-actions"><button id="action-cancel" type="button">取消</button><button id="action-confirm" class="primary" type="submit">确定</button></div></form>
  </dialog>
  <noscript>请启用 JavaScript 以使用终端。</noscript>
</body>
</html>
