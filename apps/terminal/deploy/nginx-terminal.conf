# Managed by strgo-terminal/deploy.sh
# Include inside the strgo.com HTTPS server block; proxy_pass preserves /terminal/.
location = /terminal {
    return 308 /terminal/;
}
location ^~ /terminal/ {
    proxy_pass http://127.0.0.1:3081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 5s;
    proxy_read_timeout 3700s;
    proxy_send_timeout 60s;
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 4k;
    # Setting a local add_header stops inheritance of the homepage's different CSP.
    # The Rust service supplies all terminal-specific security headers.
    add_header X-Content-Type-Options "nosniff" always;
}

