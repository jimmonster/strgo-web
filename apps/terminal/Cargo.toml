[package]
name = "strgo-terminal"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
build = "build.rs"

[dependencies]
anyhow = "=1.0.95"
axum = { version = "=0.7.9", features = ["ws"] }
base64 = "=0.22.1"
futures-util = { version = "=0.3.31", features = ["sink"] }
portable-pty = "=0.8.1"
rand = "=0.8.5"
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.138"
sha2 = "=0.10.8"
subtle = "=2.6.1"
tokio = { version = "=1.43.0", features = ["full"] }
tokio-util = { version = "=0.7.13", features = ["codec"] }

[profile.release]
lto = "thin"
strip = true

