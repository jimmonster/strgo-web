# Managed by STRGO ComfyUI API-only
server {
    listen 80;
    server_name comfyui.strgo.com;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/strgo-comfyui-acme;
        try_files $uri =404;
    }
    location / { return 308 https://comfyui.strgo.com$request_uri; }
}
