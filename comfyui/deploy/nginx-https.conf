map $http_upgrade $strgo_comfy_connection {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    server_name comfyui.strgo.com;
    ssl_certificate /etc/letsencrypt/live/comfyui.strgo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/comfyui.strgo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /var/log/nginx/strgo-comfyui-error.log crit;
    client_max_body_size 17m;
    client_body_timeout 30s;

    proxy_http_version 1.1;
    proxy_set_header Host comfyui.strgo.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $strgo_comfy_connection;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 75s;
    proxy_connect_timeout 3s;

    location = /_comfy_auth {
        internal;
        proxy_pass http://127.0.0.1:8189/internal/auth;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Content-Length "";
    }
    location ^~ /internal/ { return 404; }
    location = /login/ { proxy_pass http://127.0.0.1:8189; }
    location = /auth/start { proxy_pass http://127.0.0.1:8189; }
    location = /auth/callback { proxy_pass http://127.0.0.1:8189; }
    location = /auth/logout { proxy_pass http://127.0.0.1:8189; }

    location = / {
        auth_request /_comfy_auth;
        error_page 401 = /login/;
        proxy_pass http://127.0.0.1:8189;
    }
    location / {
        auth_request /_comfy_auth;
        proxy_pass http://127.0.0.1:8189;
    }
}
