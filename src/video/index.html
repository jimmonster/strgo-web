<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>STRGO · AI 视频</title>
  <link rel="stylesheet" href="/hub/tokens.css">
  <link rel="stylesheet" href="/video/styles.css?v={{asset_version}}">
  <script type="module" src="/video/app.js?v={{asset_version}}"></script>
</head>
<body>
  <header><a href="/">STRGO</a><strgo-navigation></strgo-navigation></header>
  <main>
    <h1>AI 视频</h1>
    <p id="notice" role="status">正在检查账号与权限…</p>
    <section id="create" hidden aria-label="视频操作台">
      <form id="generate" novalidate>
        <fieldset id="composer">
          <div class="reference-board">
            <div class="image-group">
              <div class="section-label"><h2>参考图</h2><span>最多 9 张</span></div>
              <div id="image-slots" class="image-grid" aria-label="参考图片"></div>
            </div>
            <div class="audio-group">
              <div class="section-label"><h2>音频</h2></div>
              <div id="audio-slots" class="audio-grid" aria-label="参考音频"></div>
            </div>
          </div>
          <label class="prompt-label" for="prompt">视频提示词</label>
          <textarea id="prompt" name="prompt" rows="4" required maxlength="12000" placeholder="描述画面、动作、镜头，以及参考素材的使用方式…"></textarea>
          <label class="workflow-label" for="workflow">生成工作流</label>
          <select id="workflow" aria-label="生成工作流"></select>
          <div id="fields" class="parameter-grid" aria-label="生成参数"></div>
          <p id="workflow-summary" class="hint"></p>
          <button id="generate-button" class="generate-button" type="submit">生成视频</button>
        </fieldset>
      </form>
    </section>
    <section id="archive" hidden aria-label="生成视频列表">
      <div class="list-toolbar"><h2>生成的视频</h2><div><button id="refresh" type="button" class="quiet">刷新</button><button id="open-settings" type="button" class="settings-button">设置</button></div></div>
      <p id="archive-status" role="status"></p>
      <div id="jobs" class="video-grid"></div>
      <button id="more" type="button" hidden>查看更多</button>
    </section>
  </main>
  <dialog id="settings" aria-labelledby="settings-title">
    <div class="settings-topbar"><button id="save-settings" type="button" class="generate-button">保存</button><h2 id="settings-title">视频设置</h2><button type="button" data-close="settings">返回</button></div>
    <div id="admin" hidden>
      <section>
        <h3>AutoDL 接口</h3>
        <div class="settings-workflow-row">
          <label>AutoDL URL 列表<input id="workflow-url" list="catalog" placeholder="选择目录项，或粘贴 AutoDL 工作流 URL" autocomplete="off"></label>
          <datalist id="catalog"></datalist>
          <button type="button" id="sync">拉取最新的 AutoDL</button>
        </div>
        <label>替换已有工作流<select id="replace"><option value="">添加到现有列表</option></select></label>
        <label>密钥<input id="api-key" type="password" autocomplete="new-password" maxlength="2048" placeholder="输入 AutoDL ComfyUI 密钥"></label>
        <p id="key-status" class="hint"></p>
        <div id="enabled"></div>
      </section>
      <section>
        <h3>成员生成权限</h3>
        <p class="hint">勾选未授权用户后点击上方“保存”即可授权。已授权用户会保持勾选，点“撤销”可移除权限。</p>
        <div id="members" role="group" aria-label="授权用户列表"></div>
      </section>
      <p id="admin-status" role="status"></p>
    </div>
    <p id="settings-status" role="status"></p>
  </dialog>
  <dialog id="preview" aria-labelledby="preview-title">
    <div class="dialog-heading"><h2 id="preview-title">素材预览</h2><button type="button" data-close="preview" aria-label="关闭预览">×</button></div>
    <div id="preview-content"></div>
    <div id="preview-actions" class="preview-actions"></div>
  </dialog>
  <dialog id="confirm" aria-labelledby="confirm-title">
    <form method="dialog">
      <h2 id="confirm-title">提交付费任务</h2><p id="confirm-workflow"></p>
      <p>AutoDL 将按所选接口收费，提交后会传入选中的参考素材。视频完成后自动保存到服务器。</p>
      <div class="preview-actions"><button value="cancel">取消</button><button value="submit" class="generate-button">确认生成</button></div>
    </form>
  </dialog>
</body>
</html>
